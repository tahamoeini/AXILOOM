          const workflowScope = smoke.issueListRequests.at(-1)?.workflowScope || '';

          smoke.issueExports.push({ format, report });
          document.body.dataset.lastIssueExport = JSON.stringify(evidence);
          document.title = `Axiloom renderer smoke · ${workflowScope || 'combined'} export ${format}`;
          return { ok: true };
        };
        window.__AXILOOM_SMOKE__ = smoke;
        window.confirm = (message) => { smoke.confirmations.push(String(message)); return true; };
        window.axiloom = {
          getSnapshot: async () => snapshot,
          getConfig: async () => config,
          getWorkspaceInfo: async () => ({
            id: 'default', name: config.workspaceName, path: 'synthetic-fixture', warning: '',
            workspaces: [{ id: 'default', name: config.workspaceName, active: true, path: 'synthetic-fixture', createdAt: '2026-01-01T00:00:00.000Z' }],

          getConfigurationHistory: async () => [],

              { id: 'customfield_7602', name: 'Initiative Link', schema: { type: 'string' } },

          cancelSync: async () => { smoke.cancelCalls += 1; smoke.jiraProgressHandler?.({ phase: 'cancelled' }); return { requested: true }; },
          validateConfig: async (value) => value,
          saveConfig: async (value) => {
            smoke.saveCalls += 1;
            Object.assign(config, value, { configurationRevision: Number(config.configurationRevision || 0) + 1 });
            return config;
          },
          importConfigProfile: async () => {
            smoke.importCalls += 1;
            const importedProfile = structuredClone(config);
            importedProfile.organization.name = 'Imported synthetic profile';
            importedProfile.jiraUrl = 'https://jira.synthetic.invalid';
            importedProfile.sourceInstance = {
              id: 'synthetic-dc-source', provider: 'jira-datacenter', displayName: 'Synthetic Jira DC',
              endpoint: 'https://jira.synthetic.invalid', networkAccess: { mode: 'private', approvedAddresses: [] },
            };
            importedProfile.projects = ['ALPHA'];
            importedProfile.projectRoles = { productIntake: [], technicalDelivery: ['ALPHA'], commitments: [] };
            importedProfile.teams = [
              { id: 'division-synthetic', name: 'Synthetic Division', aliases: [], parentTeamId: '', activeFrom: '', activeTo: '' },
              { id: 'team-alpha', name: 'Alpha Delivery', aliases: ['Alpha Team'], parentTeamId: 'division-synthetic', activeFrom: '2026-01-01', activeTo: '2026-12-31' },
            ];
            importedProfile.boardRoutes = [{ boardId: '77', teamId: 'team-alpha', team: 'Alpha Delivery', activeFrom: '2026-01-01', activeTo: '2026-06-30' }];
            importedProfile.teamAssignments = {
              projects: [{ projectKey: 'ALPHA', teamId: 'team-alpha', activeFrom: '2026-01-01', activeTo: '2026-12-31' }],
              components: [{ projectKey: 'ALPHA', componentId: '88', componentName: 'Synthetic Component', teamId: 'team-alpha', activeFrom: '', activeTo: '' }],
              issueOverrides: [{ issueKey: 'ALPHA-123', teamId: 'team-alpha', activeFrom: '2026-03-01', activeTo: '2026-06-30' }],

            const { project, workflowScope = '', offset = 0, limit = 50, issueType, status, epic, query, createdFrom, createdTo } = filters;
            smoke.issueListRequests.push({ ...filters, project: project || '', workflowScope });
            document.body.dataset.lastIssueWorkflowScope = workflowScope;
            document.title = `Axiloom renderer smoke · ${workflowScope || 'combined'}`;
            const scopes = workflowScope ? [workflowScope] : Object.entries(config.projectRoles).filter(([, projects]) => projects.includes(project)).map(([role]) => ({
              productIntake: 'intake', technicalDelivery: 'delivery', commitments: 'commitment',
            })[role]).filter(Boolean);
            const lifecycleFields = { backlogStatuses: 'backlog', readyStatuses: 'ready', startedStatuses: 'started', blockedStatuses: 'blocked', reviewStatuses: 'review', completedStatuses: 'delivered', cancelledStatuses: 'cancelled', entryStatuses: 'committed' };
            const rows = (!project || project === 'ALPHA') ? [syntheticIssue].map((issue) => {
              const roles = new Set(); let isDone = false;
              scopes.forEach((scope) => {
                const workflow = config.workflows?.[scope] || {};
                Object.entries(lifecycleFields).forEach(([field, role]) => {
                  if ((workflow[field] || []).some((status) => String(status).toLocaleLowerCase('en-US') === String(issue.status).toLocaleLowerCase('en-US'))) roles.add(role);

                if ((workflow.completedStatuses || []).some((status) => String(status).toLocaleLowerCase('en-US') === String(issue.status).toLocaleLowerCase('en-US'))) isDone = true;

              && (!createdTo || String(issue.created).slice(0, 10) <= createdTo));

            const timestamp = new Date().toISOString();
            const previous = snapshot.records.find((current) => current.id === id);
            const record = { id: id || `smoke-${snapshot.records.length + 1}`, kind, title, payload, createdAt: previous?.createdAt || timestamp, updatedAt: timestamp, history: [...(previous?.history || []), { eventType: previous ? 'updated' : 'created', occurredAt: timestamp, payload }] };

            return record;
