<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axiloom renderer smoke</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const config = {
          schemaVersion: 2,
          configurationRevision: 1,
          migrationStatus: 'configured',
          migrationWarnings: [],
          organization: { name: 'Synthetic organization', locale: 'en-US', timeZone: 'UTC' },
          workspaceName: 'Renderer smoke workspace',
          sourceInstance: { id: 'synthetic-source', provider: 'offline-json', displayName: 'Synthetic fixture', endpoint: '', networkAccess: { mode: 'private', approvedAddresses: [] } },
          jiraUrl: '',
          projects: [],
          projectRoles: { productIntake: [], technicalDelivery: [], commitments: [] },
          teams: [],
          boardRoutes: [],
          fieldMappings: [],
          workClassifications: [],
          issueTypeClassifications: [],
          workflows: {
            delivery: { completedStatuses: [], startedStatuses: [], blockedStatuses: [], cancelledStatuses: [], milestones: [] },
            intake: { completedStatuses: [], milestones: [] },
            commitment: { entryStatuses: [], completedStatuses: [], milestones: [] },
          },
          calendar: { configured: false, timeZone: 'UTC', workingDays: [], hoursPerDay: 8, holidays: [], workIntervals: [] },
          modules: {
            delivery: false,
            portfolio: false,
            objectives: true,
            productIntelligence: true,
            productIntake: false,
            commitments: false,
            businessSprint: false,
            outcomes: true,
            organizationAnalytics: false,
          },
          hoursPerDay: 8,
          doneStatuses: [],
          adhocTag: '',
          planningLookback: 5,
          predictabilityLookback: 5,
          minForecastCoverage: 0.7,
          minimumTimeDataCoverage: 0.7,
          capacityWarning: 0.9,
          capacityCritical: 1,
          adhocHoursWarning: 0.3,
          unspecifiedOpTypeWarning: 0.1,
          capacityOverrides: [],
          stakeholderContactPoints: [],
        };
        const snapshot = {
          summary: {
            issueCount: 0, projectCounts: [], epicCount: 0, sprintCount: 0, reportableSprints: 0,
            relationCount: 0, warningCount: 0, issuesWithoutAssignee: 0, lastIssueUpdate: null,
            openActions: 0, openRequests: 0, decisions: 0, outcomes: 0,
          },
          teams: [], projects: [], sprintMetrics: [], people: [], issues: [], issueTotal: 0,
          epics: [], records: [], links: [],
          business: { summary: {}, issues: [], statuses: [], components: [], assignees: [], componentAssignees: [], agingBuckets: [], monthly: [], ageMethod: '' },
          jiraIssueLinks: [], localIssueLinks: [],
          quality: { findings: [], fieldCoverage: {}, unknownFields: [], incompleteHistories: 0, issuesWithoutHistory: 0, conflicts: 0, evidence: { issueRevisions: 0, issueHistoryEvents: 0, sprintRevisions: 0, localLinkEvents: 0 } },
          importRuns: [],
        };
        const smoke = { config, snapshot, importCalls: 0, exportCalls: 0, saveCalls: 0, patListCalls: 0, revokeCalls: 0, forgetCalls: 0, syncCalls: 0, cancelCalls: 0, confirmations: [], jiraProgressHandler: null };
        window.__AXILOOM_SMOKE__ = smoke;
        window.confirm = (message) => { smoke.confirmations.push(String(message)); return true; };
        window.axiloom = {
          getSnapshot: async () => snapshot,
          getConfig: async () => config,
          getWorkspaceInfo: async () => ({
            id: 'default', name: config.workspaceName, path: 'synthetic-fixture', warning: '',
            workspaces: [{ id: 'default', name: config.workspaceName, active: true, path: 'synthetic-fixture', createdAt: '2026-01-01T00:00:00.000Z' }],
          }),
          getConfigurationHistory: async () => [],
          getSourceProviderCapabilities: async (providerId) => (providerId || config.sourceInstance.provider) === 'jira-datacenter'
            ? ({ id: 'jira-datacenter', label: 'Jira Server / Data Center', authentication: 'personal-access-token', capabilities: { fileImport: true, projectDiscovery: true, fieldDiscovery: true, readOnlySync: true, userInitiatedWrites: true } })
            : ({ id: 'offline-json', label: 'Offline Jira JSON import', authentication: 'none', capabilities: { fileImport: true, projectDiscovery: false, fieldDiscovery: false, readOnlySync: false, userInitiatedWrites: false } }),
          getJiraCatalog: async () => ({
            projects: { value: [{ id: '10001', key: 'ALPHA', name: 'Alpha Product' }], updatedAt: 'synthetic fixture' },
            fields: { value: [
              { id: 'customfield_7601', name: 'Estimate', schema: { type: 'number' } },
              { id: 'customfield_7602', name: 'Initiative Link', schema: { type: 'string' } },
              { id: 'customfield_7603', name: 'Delivery Team', schema: { type: 'option' } },
            ], updatedAt: 'synthetic fixture' },
            issueTypes: { value: [{ id: '101', name: 'Story' }, { id: '102', name: 'Task' }], updatedAt: 'synthetic fixture' },
            warnings: [],
          }),
          testJira: async () => ({ ok: true, displayName: 'Synthetic Jira', account: 'synthetic-user' }),
          usePat: async (_token, save) => { config.hasSavedPat = Boolean(save); return { connected: true, saved: Boolean(save) }; },
          forgetPat: async () => { smoke.forgetCalls += 1; config.hasSavedPat = false; return { connected: false, saved: false }; },
          listPats: async () => { smoke.patListCalls += 1; return [{ id: '9001', name: 'Synthetic UI token', createdAt: 'synthetic date', expiresAt: '' }]; },
          revokePat: async () => { smoke.revokeCalls += 1; config.hasSavedPat = false; return { revoked: true }; },
          startSync: async () => { smoke.syncCalls += 1; smoke.jiraProgressHandler?.({ phase: 'issues', fetched: 1, total: 2 }); return { started: true }; },
          cancelSync: async () => { smoke.cancelCalls += 1; smoke.jiraProgressHandler?.({ phase: 'cancelled' }); return { requested: true }; },
          validateConfig: async (value) => value,
          saveConfig: async (value) => {
            smoke.saveCalls += 1;
            Object.assign(config, value, { configurationRevision: Number(config.configurationRevision || 0) + 1 });
            return config;
          },
          importConfigProfile: async () => {
            smoke.importCalls += 1;
            const importedProfile = structuredClone(config);
            importedProfile.organization.name = 'Imported synthetic profile';
            importedProfile.jiraUrl = 'https://jira.synthetic.invalid';
            importedProfile.sourceInstance = {
              id: 'synthetic-dc-source', provider: 'jira-datacenter', displayName: 'Synthetic Jira DC',
              endpoint: 'https://jira.synthetic.invalid', networkAccess: { mode: 'private', approvedAddresses: [] },
            };
            importedProfile.projects = ['ALPHA'];
            importedProfile.projectRoles = { productIntake: [], technicalDelivery: ['ALPHA'], commitments: [] };
            importedProfile.fieldMappings = [
              { semanticKey: 'storyPoints', providerFieldId: 'customfield_7601', providerFieldName: 'Estimate', projectKey: 'ALPHA', issueTypeId: '101', transform: 'number' },
              { semanticKey: 'team', providerFieldId: 'customfield_7603', providerFieldName: 'Delivery Team', projectKey: 'ALPHA', issueTypeId: '', transform: 'option-label' },
            ];
            importedProfile.hasSavedPat = true;
            return {
              canceled: false,
              dryRun: true,
              profile: importedProfile,
            };
          },
          exportConfigProfile: async () => { smoke.exportCalls += 1; return { canceled: false, filePath: 'synthetic-fixture-profile.json' }; },
          getCurrentUser: async () => null,
          getIssueOverviewStats: async () => ({ issueCount: 0, openCount: 0, epicLinkedCount: 0, issuesWithoutAssignee: 0, lastIssueUpdate: null, projectCounts: [] }),
          listIssues: async () => ({ issues: [], total: 0 }),
          getCalendarPeriodReport: async () => ({ created: 0, completed: 0, completedWithoutResolution: 0, previousCreated: null, previousCompleted: null, monthly: [] }),
          getBusinessBoardReport: async () => ({ summary: {}, issues: [], total: 0 }),
          getBusinessSprints: async () => [],
          getBusinessSprintReport: async () => ({ summary: {}, issues: [] }),
          getIssueFilterOptions: async () => ({ statuses: [], priorities: [], assignees: [], components: [] }),
          onImportProgress: () => () => {},
          onJiraProgress: (callback) => { smoke.jiraProgressHandler = callback; return () => { smoke.jiraProgressHandler = null; }; },
          saveRecord: async ({ id, kind, title, payload }) => {
            const timestamp = new Date().toISOString();
            const record = { id: id || `smoke-${snapshot.records.length + 1}`, kind, title, payload, createdAt: timestamp, updatedAt: timestamp, history: [{ eventType: 'created', occurredAt: timestamp, payload }] };
            snapshot.records = snapshot.records.filter((current) => current.id !== record.id).concat(record);
            return record;
          },
          archiveRecord: async (id) => { snapshot.records = snapshot.records.filter((record) => record.id !== id); },
          exportXlsx: async () => ({ ok: true }),
          exportPdf: async () => ({ ok: true }),
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
